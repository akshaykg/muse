<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="vf-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f3d36"/>
      <stop offset="50%" stop-color="#0a2a25"/>
      <stop offset="100%" stop-color="#051714"/>
    </linearGradient>
    <linearGradient id="vf-stroke" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3dbfa4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d6e63" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="vf-facet-left" x1="16" y1="20" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2ea88f"/>
      <stop offset="100%" stop-color="#0d6e63"/>
    </linearGradient>
    <linearGradient id="vf-facet-right" x1="48" y1="20" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5be3c7"/>
      <stop offset="100%" stop-color="#229b82"/>
    </linearGradient>
    <linearGradient id="vf-facet-top" x1="32" y1="12" x2="32" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8affea"/>
      <stop offset="100%" stop-color="#34d3b0"/>
    </linearGradient>
    <linearGradient id="vf-ember" x1="32" y1="26" x2="32" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f77f00"/>
    </linearGradient>
    <filter id="vf-glow" x="20" y="16" width="24" height="24" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#vf-bg)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" stroke="url(#vf-stroke)" stroke-width="1"/>

  <!-- Milestone Forge Symbol -->
  <!-- Top milestone crystal cap -->
  <path d="M32 13L46 21L32 29L18 21L32 13Z" fill="url(#vf-facet-top)"/>

  <!-- Left isometric flank -->
  <path d="M18 21L32 29V49L18 40V21Z" fill="url(#vf-facet-left)"/>

  <!-- Right isometric flank -->
  <path d="M46 21L32 29V49L46 40V21Z" fill="url(#vf-facet-right)"/>

  <!-- Inner forge spark / glowing diamond core -->
  <g filter="url(#vf-glow)">
    <path d="M32 24L37 32L32 39L27 32L32 24Z" fill="url(#vf-ember)"/>
  </g>
  <circle cx="32" cy="32" r="1.75" fill="#ffffff"/>

  <!-- Base anvil bevel reflection -->
  <path d="M26 47L32 51L38 47" stroke="#3dbfa4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
</svg>
