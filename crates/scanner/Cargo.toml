[package]
name = "scanner"
version = "0.1.0"
edition.workspace = true

[dependencies]
domain = { path = "../domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zip = "2"
walkdir = "2"
regex = "1"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt"] }
async-trait = "0.1"
